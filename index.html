<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Cuba · gastos de a dos</title>

<meta name="theme-color" content="#c47a35">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuba">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f1e8;--card:#fffaf2;--ink:#1b1a1f;--mut:#7b7468;--line:#e7dccb;--acc:#c47a35;--accsoft:#f3e2cc;--pos:#2f7d5b;--neg:#b3402f;--shadow:0 1px 0 rgba(0,0,0,.04),0 8px 24px -12px rgba(60,40,10,.25)}
@media (prefers-color-scheme:dark){:root{--bg:#141316;--card:#1e1c21;--ink:#f3ede4;--mut:#9a9387;--line:#2c2930;--acc:#e09a52;--accsoft:#3a2d1f;--pos:#59c496;--neg:#ef7b69;--shadow:0 8px 24px -12px rgba(0,0,0,.6)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,Segoe UI,sans-serif;font-size:16px;line-height:1.4}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
#app{max-width:520px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:8px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px}
.brand small{font-family:'DM Sans';font-weight:500;font-size:13px;color:var(--mut)}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{font-size:15px;color:var(--mut);font-weight:600;margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em}
.hero{display:flex;gap:12px;align-items:flex-end;margin-bottom:14px}
.bubble{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px 20px 20px 6px;padding:14px 16px;flex:1;box-shadow:var(--shadow);font-size:17px;font-weight:500}
.bubble b{font-weight:700}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--mut)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.acc{background:var(--acc);color:#1b1208}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5}
.actions{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-bottom:14px}
.transfer{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.transfer:first-of-type{border-top:0}
.amt{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;white-space:nowrap}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.item:first-child{border-top:0}
.emoji{width:40px;height:40px;border-radius:12px;background:var(--accsoft);display:grid;place-items:center;font-size:20px;flex:none}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:13px;color:var(--mut)}
.item .r{text-align:right;flex:none}
.item .r .a{font-weight:700}
.item .r .b{font-size:12px}
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{background:none;border:0;padding:8px 4px;border-radius:12px;font-size:12px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:20px}
.nav button.on{color:var(--ink);background:var(--accsoft)}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:#1b1208;font-size:30px;font-weight:700;box-shadow:0 10px 24px -6px rgba(196,122,53,.7);z-index:5}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--line);padding:4px;border-radius:14px;margin-bottom:12px}
.seg button{border:0;background:transparent;border-radius:11px;padding:9px 6px;font-weight:600;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.scrim{position:fixed;inset:0;background:rgba(10,8,5,.5);z-index:20;display:none;align-items:flex-end;justify-content:center}
.scrim.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh-head h2{font-size:22px}
.x{border:0;background:var(--line);width:34px;height:34px;border-radius:50%}
label.f{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:12px 0 5px}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:10px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.cats button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 11px;font-size:14px;white-space:nowrap}
.cats button.on{border-color:var(--acc);background:var(--accsoft)}
.person{display:flex;align-items:center;gap:10px;padding:8px 0}
.person input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc);padding:0}
.person .val{width:110px}
.quick{display:flex;gap:8px;margin-bottom:6px}
.quick button{flex:none;border:0;background:var(--accsoft);border-radius:12px;padding:0 12px;font-weight:700;font-size:14px}
.preview{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:10px 12px;margin-top:12px;font-size:14px;min-height:44px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.stat{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.big{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;letter-spacing:-.02em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:40;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.banner{background:var(--accsoft);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.ob{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:460px;margin:0 auto;padding:24px 20px}
.ob .cuba{align-self:center}
.ob h1{font-size:30px;line-height:1.1;text-align:center}
.ob p{text-align:center;color:var(--mut);margin:0}
.empty{text-align:center;color:var(--mut);padding:18px 0;font-size:15px}
textarea{min-height:110px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.sel{display:grid;gap:8px}
.sel button{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;font-weight:700;font-size:17px;text-align:left}
.sel button.on{border-color:var(--acc);background:var(--accsoft)}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
.cuba svg{animation:wag 3.2s ease-in-out infinite;transform-origin:50% 90%}
@media (prefers-reduced-motion:reduce){.cuba svg{animation:none}}
@media (prefers-reduced-motion:no-preference){.perk .cuba svg{animation-duration:.5s}}
</style>

<script>(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();

})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ---------- categorías ----------
  var CATS = [
    { k: 'super', n: 'Supermercado', e: '🛒', w: ['super', 'supermercado', 'coto', 'carrefour', 'dia', 'jumbo', 'disco', 'chino', 'verdulería', 'verduleria', 'almacen', 'almacén', 'mercado'] },
    { k: 'comida', n: 'Salidas / comida', e: '🍽️', w: ['resto', 'restaurant', 'cena', 'almuerzo', 'cafe', 'café', 'bar', 'birra', 'cerveza', 'pizza', 'sushi', 'helado', 'delivery', 'rappi', 'pedidosya', 'mcdonald', 'burger'] },
    { k: 'alquiler', n: 'Alquiler', e: '🔑', w: ['alquiler', 'renta'] },
    { k: 'expensas', n: 'Expensas', e: '🏢', w: ['expensas', 'consorcio'] },
    { k: 'luz', n: 'Luz', e: '💡', w: ['luz', 'edenor', 'edesur', 'electricidad'] },
    { k: 'agua', n: 'Agua', e: '💧', w: ['agua', 'aysa'] },
    { k: 'gas', n: 'Gas', e: '🔥', w: ['gas', 'metrogas', 'naturgy'] },
    { k: 'internet', n: 'Internet y celular', e: '📶', w: ['internet', 'wifi', 'fibra', 'flow', 'personal flow', 'fibertel', 'telecentro', 'movistar', 'claro', 'celular', 'telefono', 'teléfono'] },
    { k: 'streaming', n: 'Streaming', e: '📺', w: ['streaming', 'netflix', 'hbo', 'max', 'amazon prime', 'prime video', 'prime', 'disney', 'star+', 'paramount', 'apple tv', 'youtube premium', 'spotify', 'deezer', 'crunchyroll'] },
    { k: 'seguro', n: 'Seguros', e: '🛡️', w: ['seguro', 'seguros', 'póliza', 'poliza', 'sancor', 'mapfre'] },
    { k: 'impuestos', n: 'Impuestos', e: '🧾', w: ['abl', 'arba', 'patente', 'monotributo', 'afip', 'arca', 'impuesto', 'impuestos', 'rentas'] },
    { k: 'casa', n: 'Casa / varios', e: '🏠', w: ['limpieza', 'ferretería', 'ferreteria', 'muebles', 'plomero', 'electricista', 'bazar'] },
    { k: 'transporte', n: 'Transporte', e: '🚗', w: ['nafta', 'uber', 'cabify', 'sube', 'peaje', 'estacionamiento', 'taxi', 'tren', 'colectivo', 'subte', 'combustible', 'ypf', 'shell'] },
    { k: 'salud', n: 'Salud', e: '💊', w: ['farmacia', 'medico', 'médico', 'dentista', 'prepaga', 'remedio', 'kinesio', 'psicologo', 'psicólogo', 'analisis', 'análisis'] },
    { k: 'ocio', n: 'Ocio', e: '🎬', w: ['cine', 'teatro', 'recital', 'juego', 'steam', 'show', 'entrada', 'salida'] },
    { k: 'viaje', n: 'Viajes', e: '✈️', w: ['hotel', 'vuelo', 'aerolinea', 'aerolínea', 'airbnb', 'pasaje', 'hospedaje', 'viaje', 'excursion', 'excursión'] },
    { k: 'mascota', n: 'Mascota', e: '🐕', w: ['veterinaria', 'vete', 'alimento balanceado', 'perro', 'gato', 'cuba'] },
    { k: 'regalo', n: 'Regalos', e: '🎁', w: ['regalo', 'cumple', 'flores'] },
    { k: 'ropa', n: 'Ropa', e: '👕', w: ['ropa', 'zapatillas', 'remera', 'jean', 'campera', 'zara'] },
    { k: 'otros', n: 'Otros', e: '📦', w: [] },
    { k: 'pago', n: 'Pago entre nosotros', e: '🤝', w: [] }
  ];
  function catInfo(k) {
    for (var i = 0; i < CATS.length; i++) if (CATS[i].k === k) return CATS[i];
    return CATS[CATS.length - 2];
  }
  // Palabras completas (o frases): «gasto» no es «gas»; acepta plural simple («seguros», «expensas»).
  function guessCategory(desc) {
    var d = ' ' + String(desc || '').toLowerCase().replace(/[^a-z0-9áéíóúüñ+]+/g, ' ').trim() + ' ';
    for (var i = 0; i < CATS.length; i++) {
      for (var j = 0; j < CATS[i].w.length; j++) {
        var w = CATS[i].w[j];
        if (d.indexOf(' ' + w + ' ') >= 0 || d.indexOf(' ' + w + 's ') >= 0) return CATS[i].k;
      }
    }
    return 'otros';
  }

  // ---------- montos ----------
  // Interpreta "1.234,56", "1234.56", "15.200", "15200", "$ 1,5" -> centavos (entero)
  function parseAmount(input) {
    if (typeof input === 'number') return isFinite(input) ? Math.round(input * 100) : null;
    var s = String(input == null ? '' : input).trim();
    var neg = /^\s*-/.test(s) || /^\(.*\)$/.test(s);
    s = s.replace(/[^\d.,]/g, '');
    if (!s || !/\d/.test(s)) return null;
    var lastDot = s.lastIndexOf('.'), lastCom = s.lastIndexOf(',');
    var decSep = null;
    if (lastDot >= 0 && lastCom >= 0) {
      decSep = lastDot > lastCom ? '.' : ',';
    } else if (lastCom >= 0) {
      var nCom = (s.match(/,/g) || []).length;
      var afterCom = s.length - lastCom - 1;
      decSep = (nCom === 1 && afterCom >= 1 && afterCom <= 2) ? ',' : null;
    } else if (lastDot >= 0) {
      var nDot = (s.match(/\./g) || []).length;
      var afterDot = s.length - lastDot - 1;
      decSep = (nDot === 1 && afterDot >= 1 && afterDot <= 2) ? '.' : null;
    }
    var intPart = s, frac = '';
    if (decSep) {
      var idx = s.lastIndexOf(decSep);
      intPart = s.slice(0, idx);
      frac = s.slice(idx + 1);
    }
    intPart = intPart.replace(/[.,]/g, '');
    if (!intPart) intPart = '0';
    frac = (frac + '00').slice(0, 2);
    var cents = parseInt(intPart, 10) * 100 + parseInt(frac, 10);
    if (!isFinite(cents)) return null;
    return neg ? -cents : cents;
  }
  function strictCents(s) {
    var n = Number(String(s).trim());
    if (!isFinite(n)) return null;
    return Math.round(n * 100);
  }
  function group(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }
  function fmt(cents, cur, opts) {
    opts = opts || {};
    var neg = cents < 0, a = Math.abs(cents);
    var whole = Math.floor(a / 100), c = a % 100;
    var sym = cur === 'ARS' || !cur ? '$' : cur === 'USD' ? 'US$' : cur + ' ';
    var body = group(whole);
    if (!opts.noDecimals || c !== 0) body += ',' + (c < 10 ? '0' : '') + c;
    return (neg ? '-' : '') + sym + body;
  }

  // ---------- divisiones ----------
  function splitProportional(total, ids, weights) {
    var sum = 0, i;
    for (i = 0; i < ids.length; i++) sum += weights[i];
    if (!(sum > 0)) return null;
    var out = [], used = 0, rems = [];
    // Con enteros se calcula en BigInt: total × peso puede pasar de 2^53 (p. ej. 10^13 centavos × un sueldo en centavos).
    var big = typeof BigInt === 'function' && Number.isSafeInteger(total) && weights.every(function (w) { return Number.isSafeInteger(w) && w >= 0; });
    if (big) {
      var T = BigInt(total), W = weights.map(function (w) { return BigInt(w); }), SUM = BigInt(0);
      W.forEach(function (w) { SUM += w; });
      var ub = BigInt(0);
      for (i = 0; i < ids.length; i++) {
        var num = T * W[i], bs = num / SUM;
        out.push([ids[i], Number(bs)]); ub += bs; rems.push({ i: i, rem: num - bs * SUM });
      }
      used = Number(ub);
      var left0 = total - used;
      rems.sort(function (a, b) { return a.rem === b.rem ? a.i - b.i : (a.rem > b.rem ? -1 : 1); });
      for (var k0 = 0; k0 < left0; k0++) out[rems[k0 % rems.length].i][1] += 1;
      return out;
    }
    for (i = 0; i < ids.length; i++) {
      var exact = total * weights[i];
      var base = Math.floor(exact / sum);
      var rem = exact - base * sum;
      out.push([ids[i], base]);
      used += base;
      rems.push({ i: i, rem: rem });
    }
    var left = total - used;
    rems.sort(function (a, b) { return b.rem - a.rem || a.i - b.i; });
    for (var k = 0; k < left; k++) out[rems[k % rems.length].i][1] += 1;
    return out;
  }

  // ---------- sueldos ----------
  // sueldos: [{ persona, desde: 'AAAA-MM-DD', cents, cur }]. Vigente a una fecha = mayor `desde` <= fecha (si empatan, el último cargado).
  function salaryAt(sueldos, id, date) {
    var best = null;
    (sueldos || []).forEach(function (s, i) {
      if (s.persona !== id || String(s.desde) > String(date)) return;
      if (!best || s.desde > best.desde || (s.desde === best.desde && i > best.i)) best = { desde: s.desde, cents: s.cents, cur: s.cur, i: i };
    });
    return best;
  }
  // -> { weights: {id: cents}, cur } | { missing: [ids] } | { mixed: true }
  function salaryWeights(sueldos, ids, date) {
    var w = {}, miss = [], cur = null, mixed = false;
    ids.forEach(function (id) {
      var s = salaryAt(sueldos, id, date);
      if (!s || !(s.cents > 0)) { miss.push(id); return; }
      w[id] = s.cents;
      if (cur && cur !== s.cur) mixed = true;
      cur = cur || s.cur;
    });
    if (miss.length) return { missing: miss };
    if (mixed) return { mixed: true };
    return { weights: w, cur: cur };
  }
  // Reparto proporcional al sueldo vigente a la fecha del gasto. Suma exacto al total.
  function salarySplit(total, ids, sueldos, date) {
    var r = salaryWeights(sueldos, ids, date);
    if (!r.weights) return r;
    var sp = splitProportional(total, ids, ids.map(function (id) { return r.weights[id]; }));
    return sp ? { sp: sp } : { missing: ids };
  }
  function splitEqual(total, ids, seed) {
    var n = ids.length;
    if (!n) return null;
    var base = Math.floor(total / n), rem = total - base * n;
    var start = n ? (Math.abs(seed || 0) % n) : 0;
    var out = ids.map(function (id) { return [id, base]; });
    for (var k = 0; k < rem; k++) out[(start + k) % n][1] += 1;
    return out;
  }
  // mode: equal | exact | percent | shares ; values: {id: number}
  function computeSplits(p) {
    var ids = p.ids || [], total = p.total, v = p.values || {}, i;
    if (!(total > 0)) return { error: 'El monto tiene que ser mayor a cero.' };
    if (!ids.length) return { error: 'Elegí al menos una persona.' };
    if (p.mode === 'equal') return { sp: splitEqual(total, ids, p.seed) };
    if (p.mode === 'shares') {
      var w = ids.map(function (id) { return Number(v[id]) || 0; });
      for (i = 0; i < w.length; i++) if (w[i] < 0) return { error: 'Las partes no pueden ser negativas.' };
      var r = splitProportional(total, ids, w);
      return r ? { sp: r } : { error: 'Poné al menos una parte.' };
    }
    if (p.mode === 'percent') {
      var ps = ids.map(function (id) { return Math.round((Number(v[id]) || 0) * 100); });
      var sumP = ps.reduce(function (a, b) { return a + b; }, 0);
      if (sumP !== 10000) return { error: 'Los porcentajes suman ' + (sumP / 100) + '%, tienen que sumar 100%.' };
      return { sp: splitProportional(total, ids, ps) };
    }
    if (p.mode === 'exact') {
      var sp = ids.map(function (id) { return [id, Math.round(Number(v[id]) || 0)]; });
      var sumE = sp.reduce(function (a, x) { return a + x[1]; }, 0);
      if (sumE !== total) return { error: 'Los montos suman ' + fmt(sumE) + ' y el gasto es ' + fmt(total) + '.', diff: total - sumE };

    }
    return { error: 'Modo de división desconocido.' };
  }

  // ---------- saldos ----------
  function live(entries) {
    var m = {};
    entries.forEach(function (e) { if (!e.del) m[e.id] = e; });
    return Object.keys(m).map(function (k) { return m[k]; });
  }

    (d.movimientos || []).forEach(function (r) {
      var e = rowToEntry(r), mk = C.monthKey(e.date);
      (ledger[mk] = ledger[mk] || {})[e.id] = e;
    });
    var cfg = d.config || {};
    return {
      sueldos: (d.sueldos || []).map(function (r) { return { id: r.id, persona: r.persona_id, desde: r.desde, cents: r.monto_centavos, cur: r.moneda, note: r.nota || '', by: r.creado_por || null }; }),
      recs: (d.recurrentes || []).map(rowToRec),
      group: members.length ? { name: cfg.nombre_grupo || 'Casa', cur: cfg.moneda_base || 'ARS', members: members } : null,
      ledger: ledger
    };
  }

  function applyPlan(ledger, applied) {
    var out = Object.assign({}, ledger);
    applied.forEach(function (a) {
      if (a.add) { var mk = C.monthKey(a.add.date); out[mk] = Object.assign({}, out[mk]); out[mk][a.add.id] = a.add; }
      else Object.keys(out).forEach(function (mk) {
        if (out[mk][a.del]) { out[mk] = Object.assign({}, out[mk]); out[mk][a.del] = Object.assign({}, out[mk][a.del], { del: true }); }
      });
    });
    return out;
  }

  return {
    decodeCfg: decodeCfg, personasToMembers: personasToMembers, membersToPersonas: membersToPersonas, rowToEntry: rowToEntry,
    entryToMov: entryToMov, repartoModo: repartoModo, planWrites: planWrites, deriveClosings: deriveClosings,
    snapshotToState: snapshotToState, applyPlan: applyPlan, repartoInfo: repartoInfo,
    rowToRec: rowToRec, recToPayload: recToPayload, addMonth: addMonth, firstDue: firstDue, dueSoon: dueSoon
  };
});
</script>
<script>
(function () {
'use strict';
var C = CubaCore;
var $ = function (s) { return document.querySelector(s); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var rid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };
var pad = function (n) { return (n < 10 ? '0' : '') + n; };
var today = function () { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
var mLabel = function (k) { var p = k.split('-'); return MESES[+p[1] - 1] + ' ' + p[0]; };
var dLabel = function (d) { var p = d.split('-'); return +p[2] + ' ' + MESES[+p[1] - 1].slice(0, 3); };
var COLORS = ['#c47a35', '#4f7c6d', '#7a5ea8', '#c0504d', '#3f6fa3', '#a68a2e'];
var LS = 'cuba:v1', LSME = 'cuba:me', LSSH = 'cuba:sheets', LSSNAP = 'cuba:sheetsnap';

// ---------------- estado ----------------
var S = { group: null, ledger: {}, entries: [], closings: [], sueldos: [], recs: [], rf: null, meId: null, tab: 'inicio', mode: 'local', loaded: false, slow: false, readOnly: false, offline: false,
  month: C.monthKey(today()), q: '', cat: '', ob: { step: 0, names: ['', ''] }, form: null, imp: null, closeMonth: C.monthKey(today()), confirmDel: null, exportText: null };
var members = function () { return (S.group && S.group.members) || []; };
var mem = function (id) { return members().filter(function (m) { return m.id === id; })[0] || { id: id, name: '?', color: '#999' }; };
var memIdx = function (id) { return members().map(function (m) { return m.id; }).indexOf(id); };
var firstName = function (id) { return mem(id).name.split(' ')[0]; };
function rebuild() {
  var all = [];
  Object.keys(S.ledger).forEach(function (m) { var o = S.ledger[m] || {}; Object.keys(o).forEach(function (id) { all.push(o[id]); }); });
  all.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : (b.at || '') < (a.at || '') ? -1 : 1; });
  S.entries = all;
  if (S.mode === 'sheets') S.closings = CubaSheets.deriveClosings(all);
}
var clean = function (o) { return JSON.parse(JSON.stringify(o)); };

// ---------------- almacenamiento ----------------
var Store = {
  db: null, user: null, uid: null, cfg: null, gen: 0, busy: null,
  // ---- Google Sheet (vía Apps Script). Solo online: sin conexión se ve lo último y no se carga nada. ----
  sheetsCfg: function () {
    var fromHash = null;
    try { fromHash = CubaSheets.decodeCfg(location.hash); } catch (e) {}
    if (fromHash) {
      try { localStorage.setItem(LSSH, JSON.stringify(fromHash)); localStorage.removeItem(LSSNAP); } catch (e) {}
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
      return fromHash;
    }
    try { var c = JSON.parse(localStorage.getItem(LSSH) || 'null'); return c && c.u && c.t ? c : null; } catch (e) { return null; }
  },
  call: function (action, body) {
    var cfg = this.cfg, ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var to = setTimeout(function () { if (ctl) ctl.abort(); }, 30000);
    var netErr = function () { var er = new Error('red'); er.code = 'red'; er.userMessage = 'No hay conexión con la Sheet. Probá de nuevo.'; return er; };
    return fetch(cfg.u, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', signal: ctl ? ctl.signal : undefined,
      body: JSON.stringify(Object.assign({ token: cfg.t, action: action }, body || {})) })
      .then(function (r) {
        return r.json().catch(function () { var er = new Error('respuesta'); er.code = 'respuesta'; er.userMessage = 'La Sheet no respondió como esperaba. Revisá que la app web esté publicada para «Cualquier persona».'; throw er; });
      }, function () { throw netErr(); })
      .then(function (d) {
        clearTimeout(to);
        if (!d || !d.ok) { var er = new Error((d && d.message) || 'respuesta'); er.code = (d && d.error) || 'respuesta'; er.userMessage = (d && d.message) || null; throw er; }
        return d;
      }, function (e) { clearTimeout(to); throw e; });
  },
  snap: function () { try { localStorage.setItem(LSSNAP, JSON.stringify({ u: this.cfg.u, group: S.group, ledger: S.ledger, sueldos: S.sueldos, recs: S.recs })); } catch (e) {} },
  refresh: function () {
    var self = this;
    var run = function () {
      var gen = self.gen, had = !!S.group, seen = {};
      S.entries.forEach(function (x) { seen[x.id] = 1; });
      return self.call('read').then(function (d) {
        if (gen !== self.gen) return; // hubo una escritura en el medio: este snapshot ya quedó viejo
        var st = CubaSheets.snapshotToState(d);
        S.group = st.group; S.ledger = st.ledger; S.sueldos = st.sueldos || []; S.recs = st.recs || []; S.offline = false; S.authErr = false; S.loaded = true; rebuild(); self.snap(); render();
        if (had && S.entries.some(function (x) { return !x.del && !seen[x.id] && x.by && x.by !== S.meId; })) { var a = $('#app'); a.classList.add('perk'); clearTimeout(self.pt); self.pt = setTimeout(function () { a.classList.remove('perk'); }, 2800); }
      }).catch(function (e) { S.loaded = true; S.offline = true; S.authErr = !!(e && (e.code === 'no_autorizado' || e.code === 'sin_token')); render(); });
    };
    var p = (this.busy || Promise.resolve()).then(run);
    this.busy = p; p.then(function () { if (self.busy === p) self.busy = null; });
    return p;
  },
  initSheets: function (cfg) {
    var self = this; this.cfg = cfg; S.mode = 'sheets';
    try { S.meId = localStorage.getItem(LSME) || null; } catch (e) {}
    try {
      var sn = JSON.parse(localStorage.getItem(LSSNAP) || 'null');
      if (sn && sn.u === cfg.u && sn.group) { S.group = sn.group; S.ledger = sn.ledger || {}; S.sueldos = sn.sueldos || []; S.recs = sn.recs || []; S.loaded = true; rebuild(); render(); }
    } catch (e) {}
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') self.refresh(); });
    window.addEventListener('online', function () { self.refresh(); });
    setInterval(function () { if (document.visibilityState === 'visible' && !self.busy && !S.form) self.refresh(); }, 60000);
    return this.refresh();
  },
  disconnect: function () {
    try { localStorage.removeItem(LSSH); localStorage.removeItem(LSSNAP); } catch (e) {}
    location.reload();
  },
  persist: function () {
    try { localStorage.setItem(LS, JSON.stringify({ group: S.group, ledger: S.ledger, closings: S.closings })); } catch (e) {}
  },
  loadLocal: function () {
    try { var d = JSON.parse(localStorage.getItem(LS) || 'null'); if (d) { S.group = d.group || null; S.ledger = d.ledger || {}; S.closings = d.closings || []; rebuild(); } } catch (e) {}
    try { S.meId = localStorage.getItem(LSME) || null; } catch (e) {}
    S.loaded = true;
  },
  init: function () {
    var self = this;
    var sh = this.sheetsCfg(); if (sh) return this.initSheets(sh);
    var timeout = new Promise(function (res) { setTimeout(function () { res('timeout'); }, 10000); });
    var get = function (n) { return (window.claude && window.claude.use) ? Promise.resolve().then(function () { return window.claude.use(n); }).catch(function () { return null; }) : Promise.resolve(null); };
    return Promise.race([Promise.all([get('db'), get('user')]), timeout]).then(function (r) {
      var db = r === 'timeout' ? null : r[0], user = r === 'timeout' ? null : r[1];
      if (!db) { S.mode = 'local'; self.loadLocal(); return; }
      S.mode = 'db'; self.db = db; self.user = user;
      try { if (user && user.can && user.can('data.write') === false) S.readOnly = true; } catch (e) {}
      return self.subscribe();
    });
  },
  subscribe: function () {
    var db = this.db, self = this, user = this.user;
    var timer = setTimeout(function () { S.slow = true; S.loaded = true; render(); }, 10000);
    var ok = function (snap) { if (!snap.metadata || !snap.metadata.fromCache) { clearTimeout(timer); S.slow = false; } };
    var bad = function (e) { clearTimeout(timer); S.loaded = true; S.err = (e && e.code) || 'error'; render(); };
    db.doc('meta/group').onSnapshot(function (s) { S.group = s.exists ? s.data() : null; S.loaded = true; ok(s); render(); }, bad);
    db.collection('ledger').onSnapshot(function (s) { var L = {}; s.docs.forEach(function (d) { L[d.id] = (d.data() || {}).entries || {}; }); S.ledger = L; rebuild(); ok(s); render(); }, bad);
    db.collection('closings').onSnapshot(function (s) {
      S.closings = s.docs.map(function (d) { return d.data(); }).sort(function (a, b) { return (b.at || '') < (a.at || '') ? -1 : 1; }); render();
    }, bad);
    try { S.meId = localStorage.getItem(LSME) || null; } catch (e) {}
    if (user && user.id) {
      return Promise.resolve(user.id()).then(function (uid) {
        if (!uid) return;
        self.uid = uid;
        db.doc('data/users/' + uid + '/me').onSnapshot(function (s) { if (s.exists && s.data().memberId) { S.meId = s.data().memberId; render(); } }, function () {});
      }).catch(function () {});
    }
  },
  saveGroup: function (g) {
    if (this.cfg) {
      var me = this;
      if (S.group && S.group.members && S.group.members.length && !g._force) return Promise.resolve();
      this.gen++;
      return this.call('savePersonas', { personas: CubaSheets.membersToPersonas(g.members) }).then(function () { return me.refresh(); });
    }
    if (this.db) {
      var ref = this.db.doc('meta/group');
      return ref.get().then(function (s) { if (s.exists && !g._force) { return; } var b = clean(g); delete b._force; return ref.set(b); });
    }
    S.group = g; delete S.group._force; this.persist(); render(); return Promise.resolve();
  },
  setMe: function (id) {
    S.meId = id;
    try { localStorage.setItem(LSME, id); } catch (e) {}
    if (this.db && this.uid) { return this.db.doc('data/users/' + this.uid + '/me').set({ memberId: id }).catch(function () {}); }
    return Promise.resolve();
  },
  putEntries: function (list, opts) {
    if (this.cfg) return this.putSheets(list, opts || {});
    var by = {};
    list.forEach(function (e) { var m = C.monthKey(e.date); (by[m] = by[m] || {})[e.id] = clean(e); });
    if (!this.db) {
      Object.keys(by).forEach(function (m) { S.ledger[m] = Object.assign({}, S.ledger[m], by[m]); });
      rebuild(); this.persist(); render(); return Promise.resolve();
    }
    var db = this.db, jobs = [];
    Object.keys(by).forEach(function (m) {
      var ids = Object.keys(by[m]), chunk = {}, size = 0;
      var flush = function () { if (Object.keys(chunk).length) { jobs.push([m, chunk]); chunk = {}; size = 0; } };
      ids.forEach(function (id) { var l = JSON.stringify(by[m][id]).length; if (size + l > 120000) flush(); chunk[id] = by[m][id]; size += l; });
      flush();
    });
    var p = Promise.resolve();
    jobs.forEach(function (j) {
      p = p.then(function () {
        var ref = db.doc('ledger/' + j[0]), body = { entries: j[1] };
        return ref.update(body).catch(function (e) { if (e && e.code === 'invalid_argument') return ref.set(body); throw e; });
      });
    });
    return p;
  },
  putSheets: function (list, opts) {
    var self = this, known = {};
    S.entries.forEach(function (x) { known[x.id] = x; });
    var plan = CubaSheets.planWrites(list, known, rid, S.sueldos);
    var p = Promise.resolve(); this.gen++;
    for (var i = 0, k = 0; i < plan.add.length; i += 400, k++) {
      (function (chunk, first) {
        p = p.then(function () { var b = { movimientos: chunk }; if (opts.lote && first) b.lote = opts.lote; return self.call('addMovimientos', b); });
      })(plan.add.slice(i, i + 400), k === 0);
    }
    if (plan.anular.length) p = p.then(function () { return self.call('anularMovimientos', { ids: plan.anular }); });
    return p.then(function () {
      S.ledger = CubaSheets.applyPlan(S.ledger, plan.applied); rebuild(); self.snap(); render(); self.refresh();
    }, function (e) { self.refresh(); throw e; });
  },
  saveSueldo: function (x) {
    var self = this; this.gen++;
    return this.call('saveSueldo', { sueldo: { id: x.id, persona_id: x.persona, desde: x.desde, monto_centavos: x.cents, moneda: x.cur, nota: x.note || '', creado_por: x.by || S.meId } }).then(function () {
      S.sueldos = S.sueldos.concat([x]); self.snap(); render(); self.refresh();
    }, function (e) { self.refresh(); throw e; });
  },
  saveRec: function (r) {
    var self = this; this.gen++;
    return this.call('saveRecurrente', { recurrente: CubaSheets.recToPayload(r) }).then(function () {
      var found = false; S.recs = S.recs.map(function (x) { if (x.id === r.id) { found = true; return r; } return x; }); if (!found) S.recs = S.recs.concat([r]);
      self.snap(); render(); self.refresh();
    }, function (e) { self.refresh(); throw e; });
  },
  saveClosing: function (c) {
    if (this.cfg) return Promise.resolve(); // el pago ya es un movimiento; los cierres salen de ahí
    if (this.db) return this.db.doc('closings/' + c.id).set(clean(c));
    S.closings.unshift(c); this.persist(); render(); return Promise.resolve();
  }
};

// ---------------- Cuba ----------------
var cuba = CubaArt.cuba;

// ---------------- helpers de vista ----------------
function curs(bal) { return Object.keys(bal).sort(function (a, b) { return a === 'ARS' ? -1 : b === 'ARS' ? 1 : a < b ? -1 : 1; }); }
function avatar(id) { var m = mem(id); return '<span class="avatar" style="background:' + esc(m.color || '#999') + '">' + esc((m.name || '?').charAt(0).toUpperCase()) + '</span>'; }
function allTransfers() {
  var ids = members().map(function (m) { return m.id; }), bal = C.balances(S.entries, ids), out = [];
  curs(bal).forEach(function (cur) { C.simplify(bal[cur]).forEach(function (t) { out.push({ from: t.from, to: t.to, cents: t.cents, cur: cur }); }); });
  return { bal: bal, transfers: out };
}
function toast(msg) { var t = $('#toast'); t.textContent = msg; t.className = 'toast show'; clearTimeout(toast._t); toast._t = setTimeout(function () { t.className = 'toast'; }, 2600); }
function fail(e) { console.error(e); toast(e && e.userMessage ? e.userMessage : 'No se pudo guardar' + (e && e.code ? ' (' + e.code + ')' : '') + '. Probá de nuevo.'); }
function monthsAvailable() {
  var set = {}; set[C.monthKey(today())] = 1;
  S.entries.forEach(function (e) { if (!e.del) set[C.monthKey(e.date)] = 1; });
  return Object.keys(set).sort().reverse();
}
function myLine(e) {
  var me = S.meId; if (!me) return '';
  if (e.type === 'payment') {
    if (e.paidBy === me) return '<div class="b mut">pagaste</div>';
    if (e.sp.some(function (x) { return x[0] === me; })) return '<div class="b mut">recibiste</div>';
    return '';
  }
  var mine = 0; e.sp.forEach(function (x) { if (x[0] === me) mine += x[1]; });
  var paid = e.paidBy === me ? e.cents : 0, net = paid - mine;
  if (net > 0) return '<div class="b pos">te deben ' + C.fmt(net, e.cur, { noDecimals: true }) + '</div>';
  if (net < 0) return '<div class="b neg">debés ' + C.fmt(-net, e.cur, { noDecimals: true }) + '</div>';
  return '<div class="b mut">sin saldo</div>';
}
function entryRow(e) {
  var info = C.catInfo(e.type === 'payment' ? 'pago' : e.cat);
  var sub = e.type === 'payment'
    ? esc(firstName(e.paidBy)) + ' le pagó a ' + esc(firstName(e.sp[0][0])) + ' · ' + dLabel(e.date)
    : 'Pagó ' + esc(firstName(e.paidBy)) + ' · ' + dLabel(e.date);
  return '<button class="item" data-act="detail" data-id="' + esc(e.id) + '"><span class="emoji">' + info.e + '</span><span class="grow"><div class="t">' + esc(e.desc) + '</div><div class="s">' + sub + '</div></span><span class="r"><div class="a">' + C.fmt(e.cents, e.cur, { noDecimals: true }) + '</div>' + myLine(e) + '</span></button>';
}
function catBars(cats, total, cur) {
  var keys = Object.keys(cats).sort(function (a, b) { return cats[b] - cats[a]; });
  if (!keys.length) return '';
  return keys.slice(0, 6).map(function (k) {
    var i = C.catInfo(k), pct = total ? Math.round(cats[k] * 100 / total) : 0;
    return '<div style="margin:9px 0"><div class="row"><span>' + i.e + ' ' + esc(i.n) + '</span><span class="grow"></span><b>' + C.fmt(cats[k], cur, { noDecimals: true }) + '</b><span class="mut" style="width:38px;text-align:right;font-size:13px">' + pct + '%</span></div><div class="bar"><i style="width:' + pct + '%"></i></div></div>';
  }).join('');
}

// ---------------- vistas ----------------
var pendingRender = false;
function render() {
  var a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $('#app').contains(a)) { pendingRender = true; return; }
  pendingRender = false;
  var app = $('#app');
  if (!S.loaded) { app.innerHTML = '<div class="ob"><div class="cuba" style="align-self:center">' + cuba('sleepy', 150) + '</div><p>Cuba está despertándose…</p></div>'; return; }
  if (S.mode === 'sheets' && !S.group && S.offline) { app.innerHTML = viewSheetsError(); return; }
  if (!S.group) { app.innerHTML = viewOnboarding(); return; }
  if (!S.meId || memIdx(S.meId) < 0) { app.innerHTML = viewWho(); return; }
  var v = S.tab === 'gastos' ? viewGastos() : S.tab === 'cierre' ? viewCierre() : S.tab === 'ajustes' ? viewAjustes() : viewInicio();
  var banner = '';
  if (S.mode === 'local') banner = '<div class="banner">Modo local: tus datos viven solo en este navegador. Abrí la app desde claude.ai con sesión iniciada para compartirla con tu pareja.</div>';
  else if (S.mode === 'sheets' && S.offline) banner = S.authErr ? '<div class="banner">La Sheet no reconoce este celular (¿cambiaron el token?). Pedí el link nuevo desde el menú Cuba de la Sheet.</div>' : '<div class="banner">Sin conexión con la Sheet: veo lo último que guardé y no puedo anotar hasta que vuelva.</div>';
  else if (S.slow) banner = '<div class="banner">No puedo conectar con los datos compartidos. Lo que ves puede estar desactualizado.</div>';
  else if (S.readOnly) banner = '<div class="banner">Tenés acceso de solo lectura: pedí permiso de <b>Contributor</b> para poder anotar gastos.</div>';
  app.innerHTML = '<div class="top"><div class="brand">' + cuba('idle', 34) + '<span>Cuba<br><small>' + esc(S.group.name || 'Casa') + '</small></span></div><button class="chip" data-act="tab" data-v="ajustes">' + esc(firstName(S.meId)) + ' ▾</button></div>' + banner + v +
    '<button class="fab" data-act="new" aria-label="Anotar gasto">+</button>' +
    '<nav class="nav"><div>' + [['inicio', '🏠', 'Inicio'], ['gastos', '🧾', 'Gastos'], ['cierre', '🤝', 'Cierre'], ['ajustes', '⚙️', 'Ajustes']].map(function (t) { return '<button class="' + (S.tab === t[0] ? 'on' : '') + '" data-act="tab" data-v="' + t[0] + '"><span>' + t[1] + '</span>' + t[2] + '</button>'; }).join('') + '</div></nav>';
}
function viewSheetsError() {
  return '<div class="ob"><div class="cuba" style="align-self:center">' + cuba('alert', 140) + '</div><h1>No llego a la Sheet</h1><p>' + (S.authErr ? 'La Sheet no reconoce este celular. Abrí el link de emparejado nuevo (menú Cuba de la Sheet).' : 'Revisá la conexión y probá de nuevo.') + '</p>' +
    '<button class="btn acc full" data-act="retry">Reintentar</button><button class="btn ghost full" style="margin-top:8px" data-act="disconnect">Desconectar este celular</button></div>';
}
function viewOnboarding() {
  var o = S.ob;
  if (o.step === 0) return '<div class="ob"><div class="cuba" style="align-self:center">' + cuba('happy', 190) + '</div><h1>¡Guau! Soy Cuba</h1><p>Soy tu guardián de la plata. Anoto los gastos de a dos, hago las cuentas sin límite diario y ladro cuando se acerca el cierre del mes.</p><button class="btn acc full" data-act="ob" data-v="1">Empezar</button>' +

    if (k === 'rdesc' && S.rf.catAuto) { S.rf.cat = C.guessCategory(el.value); var sel = $('[data-in="rcat"]'); if (sel) sel.value = S.rf.cat; }
  }
  else if (S.form) {
    if (k === 'val') S.form.vals[el.dataset.id] = el.value;
    else if (k === 'desc') { S.form.desc = el.value; if (S.form.catAuto && S.form.kind === 'expense') { var g = C.guessCategory(el.value); if (g !== S.form.cat) { S.form.cat = g; document.querySelectorAll('.cats button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === g); }); } } }
    else if (k === 'amount' || k === 'quick' || k === 'why') S.form[k] = el.value;
    updatePreview();
  }
});
