<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Cuba · gastos de a dos</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c47a35">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuba">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f1e8;--card:#fffaf2;--ink:#1b1a1f;--mut:#7b7468;--line:#e7dccb;--acc:#c47a35;--accsoft:#f3e2cc;--pos:#2f7d5b;--neg:#b3402f;--shadow:0 1px 0 rgba(0,0,0,.04),0 8px 24px -12px rgba(60,40,10,.25)}
@media (prefers-color-scheme:dark){:root{--bg:#141316;--card:#1e1c21;--ink:#f3ede4;--mut:#9a9387;--line:#2c2930;--acc:#e09a52;--accsoft:#3a2d1f;--pos:#59c496;--neg:#ef7b69;--shadow:0 8px 24px -12px rgba(0,0,0,.6)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,Segoe UI,sans-serif;font-size:16px;line-height:1.4}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
#app{max-width:520px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:8px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px}
.brand small{font-family:'DM Sans';font-weight:500;font-size:13px;color:var(--mut)}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.fold>h3{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:0;user-select:none}.fold>h3 i{font-style:normal;transition:transform .2s}.card.fold.open>h3{margin-bottom:10px}.fold.open>h3 i{transform:rotate(180deg)}.fold:not(.open)>:not(h3){display:none}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;background:var(--acc,#d89b55);border-radius:99px;transition:width .3s}
.card h3{font-size:15px;color:var(--mut);font-weight:600;margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em}
.hero{display:flex;gap:12px;align-items:flex-end;margin-bottom:14px}
.bubble{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px 20px 20px 6px;padding:14px 16px;flex:1;box-shadow:var(--shadow);font-size:17px;font-weight:500}
.bubble b{font-weight:700}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--mut)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.acc{background:var(--acc);color:#1b1208}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5}
.actions{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-bottom:14px}
.transfer{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.transfer:first-of-type{border-top:0}
.amt{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;white-space:nowrap}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.item:first-child{border-top:0}
.emoji{width:40px;height:40px;border-radius:12px;background:var(--accsoft);display:grid;place-items:center;font-size:20px;flex:none}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:13px;color:var(--mut)}
.item .r{text-align:right;flex:none}
.item .r .a{font-weight:700}
.rsrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.rsrow .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rsrow .s{font-size:12px;color:var(--mut)}.rsrow .r{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}.rsrow .a{font-weight:700;font-size:14px}.rsrow .chip{font-size:12px;padding:3px 10px}
.item.pay{padding:8px 0;background:linear-gradient(90deg,transparent,var(--accsoft) 160%)}.item.pay .coin{width:28px;height:28px;border-radius:50%;background:var(--pos);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;margin:0 7px}.item.pay .s{white-space:normal;line-height:1.35}.item.pay .s b{color:var(--ink);font-weight:600}.item.pay .a{font-size:15px}.item.pay .a.in{color:var(--pos)}.item.pay .a.out{color:var(--acc)}
.item .r .b{font-size:12px}
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{background:none;border:0;padding:8px 4px;border-radius:12px;font-size:12px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:20px}
.nav button.on{color:var(--ink);background:var(--accsoft)}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:#1b1208;font-size:30px;font-weight:700;box-shadow:0 10px 24px -6px rgba(196,122,53,.7);z-index:5}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--line);padding:4px;border-radius:14px;margin-bottom:12px}
.seg button{border:0;background:transparent;border-radius:11px;padding:9px 6px;font-weight:600;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.scrim{position:fixed;inset:0;background:rgba(10,8,5,.5);z-index:20;display:none;align-items:flex-end;justify-content:center}
.scrim.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh-head h2{font-size:22px}
.x{border:0;background:var(--line);width:34px;height:34px;border-radius:50%}
label.f{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:12px 0 5px}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:10px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.cats button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 11px;font-size:14px;white-space:nowrap}
.cats button.on{border-color:var(--acc);background:var(--accsoft)}
.person{display:flex;align-items:center;gap:10px;padding:8px 0}
.person input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc);padding:0}
.person .val{width:110px}
.quick{display:flex;gap:8px;margin-bottom:6px}
.quick button{flex:none;border:0;background:var(--accsoft);border-radius:12px;padding:0 12px;font-weight:700;font-size:14px}
.preview{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:10px 12px;margin-top:12px;font-size:14px;min-height:44px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.stat{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.big{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;letter-spacing:-.02em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:40;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.pend{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--card,#2a2a2e);color:var(--text,#eee);border:1px solid var(--line);border-radius:14px;padding:6px 12px;font-size:12.5px;z-index:6;opacity:.92;pointer-events:none}
.banner{background:var(--accsoft);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.ob{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:460px;margin:0 auto;padding:24px 20px}
.ob .cuba{align-self:center}
.ob h1{font-size:30px;line-height:1.1;text-align:center}
.ob p{text-align:center;color:var(--mut);margin:0}
.empty{text-align:center;color:var(--mut);padding:18px 0;font-size:15px}
textarea{min-height:110px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.sel{display:grid;gap:8px}
.sel button{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;font-weight:700;font-size:17px;text-align:left}
.sel button.on{border-color:var(--acc);background:var(--accsoft)}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
.cuba svg{animation:wag 3.2s ease-in-out infinite;transform-origin:50% 90%}
/* Cuba ilustrado: cada pose respira o se mueve a su manera */
.cuba img{display:block;transform-origin:50% 100%;animation:breathe 4.2s ease-in-out infinite;user-select:none;-webkit-user-drag:none}
.pose-happy img{animation:wiggle 1.2s ease-in-out infinite}
.pose-alert img{animation:lookout 3.6s ease-in-out infinite}
.pose-sleepy img{animation:breathe 6s ease-in-out infinite}
.zz{position:absolute;right:4%;top:0;font-style:normal;font-weight:800;color:var(--mut);opacity:0;animation:zfloat 3.4s ease-in infinite}
.zz b{display:inline-block;font-size:.75em;margin-left:2px}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.028)}}
@keyframes wiggle{0%,100%{transform:rotate(-2.2deg) translateY(0)}50%{transform:rotate(2.2deg) translateY(-2%)}}
@keyframes lookout{0%,100%{transform:translateX(0) rotate(0)}40%{transform:translateX(2.5%) rotate(1.2deg)}70%{transform:translateX(1%) rotate(-.6deg)}}
@keyframes zfloat{0%{opacity:0;transform:translate(0,10px) scale(.7)}25%{opacity:.85}100%{opacity:0;transform:translate(10px,-22px) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.cuba svg,.cuba img,.zz{animation:none}.zz{opacity:.7}}
@media (prefers-reduced-motion:no-preference){.perk .cuba svg{animation-duration:.5s}.perk .cuba img{animation-duration:.45s}}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:14px;font-family:inherit;cursor:pointer}.chip.on{background:var(--acc);color:#1b1208;border-color:var(--acc)}
/* Acariciar a Cuba: al tocarlo alterna dos poses mimado y salen corazones */
.petting img{animation:petlean .76s ease-in-out infinite !important}
@keyframes petlean{0%,100%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(2.5deg) translateY(1.5%)}}
.heart{position:absolute;bottom:62%;width:15px;height:15px;pointer-events:none;opacity:0;animation:heartup 1.35s ease-out forwards}
.plane{position:fixed;top:28%;left:-40px;font-size:30px;z-index:9;pointer-events:none;animation:fly 2.4s ease-in forwards}@keyframes fly{to{transform:translateX(120vw) translateY(-70px) rotate(-8deg)}}
@keyframes heartup{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translateY(-52px) scale(1.15) rotate(var(--r,0deg))}}
.bone{position:fixed;top:-30px;font-size:26px;pointer-events:none;z-index:99;animation:bonefall 1.5s ease-in forwards}
@keyframes bonefall{to{transform:translateY(105vh) rotate(260deg)}}
@media (prefers-reduced-motion:reduce){.petting img{animation:none !important}.heart,.bone{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>/*CORE*/</script>
<script>/*CUBAIMG*/</script>
<script>/*CUBA*/</script>
<script>/*SHEETS*/</script>
<script>/*RESUMEN*/</script>
<script>/*AVISOS*/</script>
<script>
(function () {
'use strict';
var C = CubaCore;
var $ = function (s) { return document.querySelector(s); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var rid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };
var pad = function (n) { return (n < 10 ? '0' : '') + n; };
var today = function () { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
var mLabel = function (k) { var p = k.split('-'); return MESES[+p[1] - 1] + ' ' + p[0]; };
var dLabel = function (d) { var p = d.split('-'); return +p[2] + ' ' + MESES[+p[1] - 1].slice(0, 3); };
var COLORS = ['#c47a35', '#4f7c6d', '#7a5ea8', '#c0504d', '#3f6fa3', '#a68a2e'];
var LS = 'cuba:v1', LSME = 'cuba:me', LSSH = 'cuba:sheets', LSSNAP = 'cuba:sheetsnap', LSOUT = 'cuba:outbox';

// ---------------- estado ----------------
var S = { reglas: {}, resumenes: [], rs: null, catProg: null, fold: {}, group: null, ledger: {}, entries: [], closings: [], sueldos: [], recs: [], eventos: [], evAll: [], all: [], evId: null, lotes: [], dudosas: [], catBusy: false, catMsg: '', impMap: {}, impCur: '', rf: null, meId: null, tab: 'inicio', mode: 'local', loaded: false, slow: false, readOnly: false, offline: false,
  month: C.monthKey(today()), months: [C.monthKey(today())], perOpen: false, q: '', cat: '', ob: { step: 0, names: ['', ''] }, form: null, imp: null, closeMonth: C.monthKey(today()), confirmDel: null, exportText: null };
var members = function () { return (S.group && S.group.members) || []; };
var mem = function (id) { return members().filter(function (m) { return m.id === id; })[0] || { id: id, name: '?', color: '#999' }; };
var memIdx = function (id) { return members().map(function (m) { return m.id; }).indexOf(id); };
var firstName = function (id) { return mem(id).name.split(' ')[0]; };
function rebuild() {
  var all = [];
  Object.keys(S.ledger).forEach(function (m) { var o = S.ledger[m] || {}; Object.keys(o).forEach(function (id) { all.push(o[id]); }); });
  all.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : (b.at || '') < (a.at || '') ? -1 : 1; });
  S.all = all;                                                       // todo, para buscar por id
  S.entries = all.filter(function (e) { return !e.ev; });            // lo del mes: los viajes y eventos van aparte
  S.evAll = all.filter(function (e) { return !!e.ev; });
  if (S.mode === 'sheets') S.closings = CubaSheets.deriveClosings(all);
}
var clean = function (o) { return JSON.parse(JSON.stringify(o)); };

// ---------------- cola de envíos ----------------
var Outbox = {
  q: [], running: false, timer: null,
  load: function () { try { this.q = JSON.parse(localStorage.getItem(LSOUT) || '[]') || []; } catch (e) { this.q = []; } S.pend = this.q.length; },
  save: function () { try { localStorage.setItem(LSOUT, JSON.stringify(this.q)); } catch (e) {} S.pend = this.q.length; },
  push: function (action, body) { this.q.push({ a: action, b: body }); this.save(); },
  go: function () { render(); this.run(); },
  run: function () {
    var self = this; if (this.running || !this.q.length || !Store.cfg) return;
    this.running = true; clearTimeout(this.timer);
    var next = function () {
      var j = self.q[0];
      if (!j) { self.running = false; S.sync = ''; S.pend = 0; render(); Store.refresh({ full: true }); return; }
      Store.call(j.a, j.b).then(function () { self.q.shift(); self.save(); S.sync = ''; pill(); next(); }, function (e) {
        var pasajero = !e || !e.code || e.code === 'red' || e.code === 'ocupado' || e.code === 'respuesta';
        if (pasajero) { self.running = false; S.sync = 'espera'; pill(); self.timer = setTimeout(function () { self.run(); }, 6000); return; }   // sin señal o backend ocupado: sigue en la cola
        self.q.shift(); self.save(); fail(e); next();                                         // lo rechazó el backend: se avisa y se vuelve a la Sheet
      });
    };
    next();
  }
};
function pill() { var el = $('#pend'); if (!el) return; el.textContent = S.sync === 'espera' ? 'Sin señal: ' + S.pend + (S.pend === 1 ? ' cambio espera' : ' cambios esperan') + ' para enviarse' : 'Guardando…'; el.style.display = S.pend ? '' : 'none'; }

// ---------------- almacenamiento ----------------
var Store = {
  db: null, user: null, uid: null, cfg: null, gen: 0, busy: null,
  // ---- Google Sheet (vía Apps Script). Solo online: sin conexión se ve lo último y no se carga nada. ----
  sheetsCfg: function () {
    var fromHash = null;
    try { fromHash = CubaSheets.decodeCfg(location.hash); } catch (e) {}
    if (fromHash) {
      try { localStorage.setItem(LSSH, JSON.stringify(fromHash)); localStorage.removeItem(LSSNAP); } catch (e) {}
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
      return fromHash;
    }
    try { var c = JSON.parse(localStorage.getItem(LSSH) || 'null'); return c && c.u && c.t ? c : null; } catch (e) { return null; }
  },
  call: function (action, body, intento) {
    var self = this; intento = intento || 0;
    return this.call1(action, body).catch(function (e) {
      if (e && e.code === 'ocupado' && intento < 4) return new Promise(function (ok) { setTimeout(ok, 1500 * (intento + 1)); }).then(function () { return self.call(action, body, intento + 1); });
      throw e;
    });
  },
  call1: function (action, body) {
    var cfg = this.cfg, ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var to = setTimeout(function () { if (ctl) ctl.abort(); }, action === 'categorizar' ? 90000 : 30000);
    var netErr = function () { var er = new Error('red'); er.code = 'red'; er.userMessage = 'No hay conexión con la Sheet. Probá de nuevo.'; return er; };
    return fetch(cfg.u, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', signal: ctl ? ctl.signal : undefined,
      body: JSON.stringify(Object.assign({ token: cfg.t, action: action }, body || {})) })
      .then(function (r) {
        return r.json().catch(function () { var er = new Error('respuesta'); er.code = 'respuesta'; er.userMessage = 'La Sheet no respondió como esperaba. Revisá que la app web esté publicada para «Cualquier persona».'; throw er; });
      }, function () { throw netErr(); })
      .then(function (d) {
        clearTimeout(to);
        if (!d || !d.ok) { var er = new Error((d && d.message) || 'respuesta'); er.code = (d && d.error) || 'respuesta'; er.userMessage = (d && d.message) || null; throw er; }
        return d;
      }, function (e) { clearTimeout(to); throw e; });
  },
  snap: function () { try { localStorage.setItem(LSSNAP, JSON.stringify({ u: this.cfg.u, group: S.group, ledger: S.ledger, sueldos: S.sueldos, recs: S.recs, eventos: S.eventos, lotes: S.lotes, dudosas: S.dudosas, reglas: S.reglas, resumenes: S.resumenes })); } catch (e) {} },
  refresh: function (opts) {
    var self = this; opts = opts || {};
    var run = function () {
      if (Outbox.q.length) return Promise.resolve();   // primero se envía lo pendiente; leer ahora pisaría lo recién anotado
      var gen = self.gen, had = !!S.group, seen = {};
      S.entries.forEach(function (x) { seen[x.id] = 1; });
      var liviano = S.loaded && self.rev && !S.offline && (Date.now() - (self.fullAt || 0) < 600000) && !opts.full;   // casi siempre alcanza con preguntar «¿cambió algo?»

// ---------------- resumen de tarjeta ----------------
function dLarga(iso) { var m = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic']; return +iso.slice(8, 10) + ' ' + m[+iso.slice(5, 7) - 1]; }
function misResumenes() {
  var by = {}; S.resumenes.forEach(function (r) { if (r.persona_id === S.meId && (!by[r.tarjeta] || r.cierre > by[r.tarjeta].cierre)) by[r.tarjeta] = r; });
  return Object.keys(by).map(function (k) { return by[k]; });
}
function resumenFalta() { // resúmenes que ya cerraron y todavía no se subieron (2 días de gracia)
  var lim = new Date(Date.parse(today() + 'T00:00:00Z') - 2 * 86400000).toISOString().slice(0, 10);
  return misResumenes().filter(function (r) { return r.proximo_cierre && r.proximo_cierre <= lim; });
}
function rsDolar() { var d = (S.rs && S.rs.dolar) || {}, tc = C.parseAmount(d.tc), pct = parseFloat(String(d.pct || '0').replace(',', '.')) || 0; return { tc: tc > 0 ? tc / 100 : 0, pct: pct, extra: d.extra || 0, ids: d.ids || [] }; }

  if (x.cur !== 'USD') return { cents: x.cents, cur: x.cur, nota: '' };
  var d = rsDolar(); if (!d.tc) return { cents: x.cents, cur: 'USD', nota: '', sinTc: true };
  var pc = d.pct + (d.ids.indexOf(x.id) >= 0 ? d.extra : 0);
  return { cents: CubaResumen.aPesos(x.cents, d.tc, pc), cur: 'ARS', nota: ' · USD ' + C.fmt(x.cents, 'USD').replace(/[^\d.,]/g, '') + ' × ' + String(d.tc).replace('.', ',') + (pc ? ' + ' + String(pc).replace('.', ',') + '% impuestos' : '') };
}
function repartoFecha(ids, fecha) { // si el sueldo se cargó después del gasto, se usa el más antiguo cargado (no se cae a partes iguales)
  var lim = ''; ids.forEach(function (id) { var mn = ''; (S.sueldos || []).forEach(function (q) { if (q.persona === id && (!mn || q.desde < mn)) mn = q.desde; }); if (mn > lim) lim = mn; });
  return lim && fecha < lim ? lim : fecha;
}
function viewResumen() {
  if (S.mode !== 'sheets') return '';
  var h = '<div class="card"><h3>Resumen de tarjeta</h3>';
  var mis = misResumenes();
  if (!S.rs) {
    h += '<p class="mut" style="margin:0 0 10px;font-size:14px">Subí el PDF del resumen. Cuba te muestra los consumos y vos marcás cuáles son <b>compartidos</b>: solo esos entran. Lo demás no se guarda.</p>';
    mis.forEach(function (r) { h += '<div class="stat"><span>' + esc(r.tarjeta) + ' · último cierre ' + dLarga(r.cierre) + '</span><b class="mut">' + (r.proximo_cierre ? 'próx. ' + dLarga(r.proximo_cierre) : '') + '</b></div>'; });
    h += '<input type="file" id="rsfile" accept=".pdf,application/pdf,.txt,text/plain" style="margin:8px 0"><textarea id="rspaste" data-in="rspaste" placeholder="…o pegá acá el texto del resumen"></textarea>' +
      '<button class="btn full" style="margin-top:8px" data-act="rsread"' + (S.readOnly ? ' disabled' : '') + '>Leer resumen</button>';
    if (S.rsMsg) h += '<div class="preview neg" style="margin-top:8px">' + esc(S.rsMsg) + '</div>';
    return h + '</div>';
  }

    try { localStorage.setItem(LSSH, JSON.stringify(ok)); localStorage.removeItem(LSSNAP); } catch (e) {}
    location.reload();
  },
  export: function () { S.exportText = C.exportCSV(S.all, members()); render(); },
  copyexp: function () { copyText(S.exportText, 'CSV copiado'); }
};

// Descripción prolija y, en cada gasto nuevo, categoría sugerida por la memoria de Cuba y Gemini.
function sugerirCategoria(d) {
  if (S.mode !== 'sheets' || !S.form || S.form.kind !== 'expense' || !S.form.catAuto || S.readOnly || d.length < 3) return;
  Store.categorizar([{ descripcion: d, monto_centavos: 0, moneda: S.form.cur || 'ARS' }]).then(function (r) {
    var x = r.resultados && r.resultados[0];
    if (!x || x.categoria === 'otros' || x.confianza < 0.7 || !S.form || !S.form.catAuto || (S.form.desc || '').trim() !== d) return;
    S.form.cat = x.categoria; document.querySelectorAll('.cats button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === x.categoria); });
  }).catch(function () {});
}
document.addEventListener('focusout', function (ev) {
  var el = ev.target; if (!el || !el.dataset || el.dataset.in !== 'desc' || !S.form) return;
  var sv = S.form.kind === 'expense' ? C.servicioDesc(el.value, S.form.date) : null, d = sv ? sv.desc : C.tidyDesc(el.value);
  if (d !== el.value) el.value = d;
  S.form.desc = d;
  if (sv && S.form.catAuto && S.form.cat !== sv.cat) { S.form.cat = sv.cat; document.querySelectorAll('.cats button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === sv.cat); }); }
  if (S.form.kind === 'expense') sugerirCategoria(d);
});

// ---------------- acariciar a Cuba ----------------
var PET = { n: 0, last: 0 };
function petHeart(box) {
  var h = document.createElement('span'); h.className = 'heart';
  h.style.left = (20 + Math.random() * 60) + '%'; h.style.setProperty('--r', (Math.random() * 30 - 15) + 'deg');
  h.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 5 6.3 5c2 0 3.7 1.1 4.7 2.7C12 6.1 13.7 5 15.7 5 19 5 21.1 8.3 19.6 11.7 19.5 11.9 12 21 12 21z" fill="#e0566c"/></svg>';
  box.appendChild(h); setTimeout(function () { if (h.parentNode) h.parentNode.removeChild(h); }, 1500);
}
document.addEventListener('click', function (ev) {
  var box = ev.target.closest && ev.target.closest('.cuba'); if (!box) return;
  var img = box.querySelector('img'), I = window.CUBA_IMG; if (!img || !I || !I.mimado_a || !I.mimado_b) return;
  var now = Date.now(); PET.n = now - PET.last < 3000 ? PET.n + 1 : 1; PET.last = now;
  if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
  var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!box._pet) {
    box._pet = { orig: img.src, i: 0 }; box.classList.add('petting'); img.src = I.mimado_a;
    if (!calm) box._pet.iv = setInterval(function () { if (!box.isConnected) return; box._pet.i++; img.src = box._pet.i % 2 ? I.mimado_b : I.mimado_a; }, 380);
  }
  if (!calm) { petHeart(box); if (PET.n % 2 === 0) petHeart(box); }
  clearTimeout(box._pet.end);
  box._pet.end = setTimeout(function () { clearInterval(box._pet.iv); if (box.isConnected) { img.src = box._pet.orig; box.classList.remove('petting'); } box._pet = null; }, 2200);
  if (PET.n === 10 && !calm) { for (var k = 0; k < 9; k++) { var b = document.createElement('span'); b.className = 'bone'; b.textContent = '🦴'; b.style.left = (4 + k * 11) + '%'; b.style.animationDelay = (k % 3) * 0.15 + 's'; document.body.appendChild(b); setTimeout(function (x) { return function () { x.remove(); }; }(b), 2000); } toast('Cuba te quiere. Y pide un hueso 🦴'); }
});

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]'); if (!el) { if (ev.target.id === 'scrim') closeSheet(); return; }
  if (el.type === 'checkbox') return;
  var f = A[el.dataset.act]; if (f) { try { f(el); } catch (e) { console.error(e); } }
});
document.addEventListener('change', function (ev) {
  var el = ev.target;
  if (el.type === 'checkbox' && el.dataset.act === 'toggle') { A.toggle(el); return; }
  if ((el.id === 'rstc' || el.id === 'rspct') && S.rs) { S.rs.dolar[el.id === 'rstc' ? 'tc' : 'pct'] = el.value; render(); return; }
  if (el.type === 'file' && el.id === 'rsfile') {
    var fr = el.files && el.files[0]; if (!fr) return;
    var rr = new FileReader();
    rr.onload = function () {
      if (/\.pdf$/i.test(fr.name) || fr.type === 'application/pdf') {
        CubaResumen.pdfTexto(rr.result).then(rsDe).catch(function () { S.rsMsg = 'No pude leer ese PDF. Abrilo, seleccioná todo el texto, copialo y pegalo acá abajo.'; render(); });
      } else rsDe(String(rr.result || ''));
    };
    if (/\.pdf$/i.test(fr.name) || fr.type === 'application/pdf') rr.readAsArrayBuffer(fr); else rr.readAsText(fr);
    return;
  }
  if (el.type === 'file') {
    var fl = el.files && el.files[0]; if (!fl) return;
    var rd = new FileReader(); rd.onload = function () { $('#paste').value = String(rd.result || ''); A.impprev(); }; rd.readAsText(fl);
    return;
  }
  var k = el.dataset && el.dataset.in; if (!k) return;
  else if (k === 'catfix') { if (el.value) confirmarGrupo(+el.dataset.i, el.value); }
  else if (k === 'catf') { S.cat = el.value; render(); }
  else if (k === 'closemonth') { S.closeMonth = el.value; render(); }
  else if (k === 'me') { Store.setMe(el.value).then(render); }
  else if (k === 'impmap') { S.impMap[el.dataset.id] = el.value; render(); }
  else if (k === 'impcur') { S.impCur = el.value; render(); }
  else if (k === 'rename') {
    var g = clean(S.group); g.members.forEach(function (m) { if (m.id === el.dataset.id && el.value.trim()) m.name = el.value.trim(); }); g._force = true;
    Store.saveGroup(g).then(function () { toast('Guardado'); }).catch(fail);
  }
  else if (S.ef && (k === 'evcur' || k === 'evfrom' || k === 'evto')) { S.ef[k === 'evcur' ? 'cur' : k === 'evfrom' ? 'from' : 'to'] = el.value; }
  else if (S.rf && (k === 'rcur' || k === 'rcat' || k === 'rpaid')) { S.rf[k.slice(1)] = el.value; if (k === 'rcat') S.rf.catAuto = false; }
  else if (k === 'paidBy' || k === 'to' || k === 'cur' || k === 'date') { S.form[k] = el.value; if (k === 'date' && S.form.mode === 'salary' && !salaryOk(el.value)) { S.form.mode = 'equal'; renderForm(); return; } updatePreview(); }
});
document.addEventListener('input', function (ev) {
  var el = ev.target, k = el.dataset && el.dataset.in; if (!k) return;
  if (k === 'obname') { S.ob.names[+el.dataset.i] = el.value; }
  else if (k === 'search') { S.q = el.value; var l = $('#list'); if (l) l.innerHTML = listHtml(); }
  else if (S.ef && k === 'evname') { S.ef.name = el.value; }
  else if (k === 'calcamt') { S.calcAmt = el.value; var co = $('#calcout'); if (co) co.innerHTML = calcRepartoHtml(el.value); }
  else if (S.rf && (k === 'radj' || k === 'radjn')) { S.rf[k === 'radj' ? 'adj' : 'adjNext'] = el.value; }
  else if (k === 'ajpct') {
    var rr = S.recs.filter(function (x) { return x.id === el.dataset.id; })[0], pv = $('#ajprev'), pc = parseFloat(String(el.value).replace(',', '.')), nn = rr && isFinite(pc) ? CubaAvisos.aplicarAjuste(rr, pc, CubaSheets.addMonth) : null;
    if (pv) pv.textContent = nn ? 'Pasa a ≈ ' + C.fmt(nn.cents, nn.cur, { noDecimals: true }) + ' por mes.' : '';
  }
  else if (S.rf && (k === 'rdesc' || k === 'ramount' || k === 'rday')) {
    S.rf[k.slice(1)] = el.value;
    if (k === 'rdesc' && S.rf.catAuto) { S.rf.cat = C.guessCategory(el.value); var sel = $('[data-in="rcat"]'); if (sel) sel.value = S.rf.cat; }
  }
  else if (S.form) {
    if (k === 'val') S.form.vals[el.dataset.id] = el.value;
    else if (k === 'desc') { S.form.desc = el.value; if (S.form.catAuto && S.form.kind === 'expense') { var g = C.guessCategory(el.value); if (g !== S.form.cat) { S.form.cat = g; document.querySelectorAll('.cats button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === g); }); } } }
    else if (k === 'amount' || k === 'quick' || k === 'why') S.form[k] = el.value;
    updatePreview();
  }
});
document.addEventListener('focusout', function () { setTimeout(function () { if (pendingRender) render(); }, 60); });
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape') closeSheet();
  if (ev.key === 'Enter' && ev.target.id === 'quick') { ev.preventDefault(); A.quick(); }
});

try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && location.hostname.indexOf('claude') < 0) navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
render();
Store.init().then(render).catch(function (e) { console.error(e); S.mode = 'local'; Store.loadLocal(); render(); });
})();
</script>
